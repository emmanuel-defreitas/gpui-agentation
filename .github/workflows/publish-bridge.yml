name: Publish MCP Bridge

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bridge version (for example 0.1.0); must match Cargo.toml and server.json'
        required: true
        type: string
      publish:
        description: 'Publish after validation (false performs a dry run only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-gpui-agentation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    env:
      BRIDGE_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require promoted main history
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run publishing from main after dev → next → main promotion.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Verify pinned Ely snapshot
        run: python3 .github/scripts/check-ely-snapshot.py
      - name: Check version and Registry ownership metadata
        run: |
          make version-check
          python3 .github/scripts/check-bridge-release.py --require-publishable
      - name: Format, lint, test and dry-run the exact package
        working-directory: .
        run: |
          cargo package --no-verify --all-features --locked
          python3 .github/scripts/check-bridge-release.py --require-publishable --check-package-size
          cargo fmt -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo publish --dry-run --all-features --locked

  publish:
    needs: verify
    if: inputs.publish == true
    runs-on: macos-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Get short-lived crates.io publishing credentials
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the combined package with the MCP binary
        working-directory: .
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features --locked
