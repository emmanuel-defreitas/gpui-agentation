name: Website CI

on:
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  push:
    branches: [dev, next, main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run check
