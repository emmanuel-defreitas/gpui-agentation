name: PR Semver

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    if: |
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'bug/') ||
      startsWith(github.head_ref, 'doc/') ||
      startsWith(github.head_ref, 'chore/')
    runs-on: ubuntu-latest
    steps:
      - name: Require a conventional semver title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TITLE" | grep -qE '^(feat|feature|fix|docs|chore|ci|refactor|test)(\([^)]+\))?!?: .+'; then
            echo "Lifecycle PR titles must use conventional commits, for example: feat: add search."
            exit 1
          fi
