# Tag preview — read-only preview using the production release calculator.
#
# This is a DRY RUN. It computes what the next semver tag *would* be and writes it
# to the job summary / logs. It never pushes a tag and never creates a release.
#
# Authoritative tagging is unchanged and still owned by:
#   - release-tag.yml          (vX.Y.Z on next → main, validated against Cargo.toml)
#   - dev-release-candidate.yml / next-preview.yml  (-dev.N / preview tags)
#
# Share conventional-commit and explicit release-plan rules with release-tag.yml.
# No third-party tagging action or write permission is needed for this preview.
name: Tag Preview (dry run)

on:
  pull_request:
    branches: [dev, ai/v6-01-annotation-model, ai/v6-02-annotation-tools]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read   # dry run only — no tag push, no release

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags are required to compute the bump
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Write preview to job summary
        env:
          PREVIEW_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          version="$(python3 .github/scripts/release_version.py next --revision "$PREVIEW_REVISION")"
          {
            echo "### 🔖 Next-version preview (dry run)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            printf "| Predicted next tag | \`v%s\` |\n" "$version"
            printf "| Reviewed revision | \`%s\` |\n" "$PREVIEW_REVISION"
            echo ""
            echo "> Advisory only — no tag was pushed. The authoritative \`vX.Y.Z\`"
            echo "> tag and GitHub Release are produced by **release-tag.yml** when"
            echo "> the \`next → main\` promotion PR merges."
          } >> "$GITHUB_STEP_SUMMARY"
