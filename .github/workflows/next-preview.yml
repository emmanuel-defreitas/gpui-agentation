name: Promotion Preview

on:
  push:
    branches: [next]
  pull_request:
    branches: [next, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require the same-repository promotion lane
        if: github.event_name == 'pull_request'
        env:
          GH_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo 'Promotion must come from this repository.' >&2
            exit 1
          fi
          case "$HEAD_REF:$BASE_REF" in
            dev:next|next:main) ;;
            *) echo 'Only dev → next → main promotion is allowed.' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate the reviewed release metadata
        run: make version-check release-version-check
