name: MCP Bridge CI

on:
  pull_request:
    paths:
      - 'crates/gpui-agentation-mcp/**'
      - '.github/workflows/bridge-ci.yml'
      - '.github/workflows/publish-bridge.yml'
      - '.github/scripts/check-bridge-release.py'
  push:
    branches: [dev, next, main]
    paths:
      - 'crates/gpui-agentation-mcp/**'
      - '.github/workflows/bridge-ci.yml'
      - '.github/workflows/publish-bridge.yml'
      - '.github/scripts/check-bridge-release.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: crates/gpui-agentation-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gpui-agentation-mcp
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
