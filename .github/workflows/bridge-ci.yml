name: MCP Bridge CI

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'build.rs'
      - 'build/**'
      - 'vendor/ely/**'
      - '.github/scripts/check-ely-snapshot.py'
      - 'server.json'
      - '.github/workflows/bridge-ci.yml'
      - '.github/workflows/publish-bridge.yml'
      - '.github/scripts/check-bridge-release.py'
  push:
    branches: [dev, next, main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'build.rs'
      - 'build/**'
      - 'vendor/ely/**'
      - '.github/scripts/check-ely-snapshot.py'
      - 'server.json'
      - '.github/workflows/bridge-ci.yml'
      - '.github/workflows/publish-bridge.yml'
      - '.github/scripts/check-bridge-release.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: python3 .github/scripts/check-ely-snapshot.py
      - run: python3 .github/scripts/check-bridge-release.py --require-publishable
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --bin gpui-agentation --locked
      - name: Verify default Cargo install produces the Registry executable
        shell: bash
        run: |
          cargo install --path . --locked --debug --root "$RUNNER_TEMP/agentation-install"
          "$RUNNER_TEMP/agentation-install/bin/gpui-agentation" --version
