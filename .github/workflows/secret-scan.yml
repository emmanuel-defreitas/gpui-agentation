# Secret scanning gate.
#
# This is deliberately a separate workflow rather than a job inside `validation.yml`:
# `validation.yml` triggers only on `push` to `dev`, so it can never gate a pull
# request. Secret scanning has to run on `pull_request` to be a useful check.
#
# The matching local hook lives in `.pre-commit-config.yaml`. That hook is advisory
# — `git commit --no-verify` skips it — so this workflow is the actual enforcement
# point. Make it a required status check on `dev`, `next`, and `main`.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [dev, next, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the `rev` pinned in .pre-commit-config.yaml so local and CI
  # runs agree on the ruleset.
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Detect hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: required for the base..head range on pull requests and
          # for the full-history sweep on branch pushes.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact is not optional: without it a finding prints the secret verbatim
      # into a build log that may be publicly readable.
      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --no-banner --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: gitleaks git . --no-banner --redact --verbose
