# Issue triage — status safety net. When a draft PR is opened from a lifecycle branch, ensure the
# linked issue is status:in-progress (normally already true from Issue -> Feature Branch).
# Deterministic. The in-review and qa transitions are not automated; set those labels by hand.
name: Issue Status Sync

on:
  pull_request:
    types: [opened, reopened]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  ensure-in-progress:
    # Only draft PRs from a lifecycle prefix (feature/bug/doc/chore).
    if: github.event.pull_request.draft == true && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'bug/') || startsWith(github.head_ref, 'doc/') || startsWith(github.head_ref, 'chore/'))
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issue to in-progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Parse issue number: digits right after the lifecycle prefix (feature/bug/doc/chore).
          issue=$(printf '%s' "$HEAD_REF" | sed -nE 's#^(feature|bug|doc|chore)/([0-9]+).*#\2#p')
          if [ -z "$issue" ]; then
            echo "No issue number in branch '$HEAD_REF' — nothing to sync."
            exit 0
          fi
          echo "Ensuring issue #$issue is status:in-progress"
          gh issue edit "$issue" --add-label "status:in-progress" --remove-label "status:todo" || true
