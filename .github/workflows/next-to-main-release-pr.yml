name: Next to Main Release PR

on:
  workflow_run:
    workflows: [Promotion Preview]
    types: [completed]
    branches: [next]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate the reviewed release version
        run: make version-check release-version-check
      - name: Open the approved preview for production review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$REPOSITORY" --base main --head next --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing:-}" ]; then
            echo "Release PR #$existing already exists."
            exit 0
          fi
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head next \
            --title "release: promote preview ${SHA:0:7} to production" \
            --body "Promotion metadata passed for commit \`${SHA}\`. Native tests run locally on macOS; confirm local verification before merging."
