# Promotion gate for the template repo. This intentionally validates the workflow/template surface
# rather than assuming an application stack already exists.
name: Validation

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-dev
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release policy assets
        run: |
          test -f .github/BRANCH-AND-RELEASE-POLICY.md
          test -f .github/LIFECYCLE.md
