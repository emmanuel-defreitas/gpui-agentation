name: Setup
description: uv and the project's Python toolchain.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install Python
      shell: bash
      run: uv python install
