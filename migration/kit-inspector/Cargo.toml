[package]
name = "agentation-kit-inspector"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Dedicated cutover consumer: never links the old native dependency graph.
[workspace]

[dependencies]
gpui = { package = "gpui-kit", version = "=0.11.0", default-features = false, features = ["component", "assets", "inspector"] }
agentation-kit-probe = { path = "../kit-probe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
shlex = "2"

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.11.0", default-features = false, features = ["component", "assets", "inspector", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6"

# Match the production workspace's policy for shared service source.
[lints.clippy]
collapsible_if = "allow"
