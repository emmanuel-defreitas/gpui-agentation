[package]
name = "agentation-kit-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Independent graph: the production workspace remains on GPUI 0.3.8 until
# the atomic cutover. Never add this probe as a production dependency.
[workspace]

[dependencies]
gpui = { package = "gpui-kit", version = "=0.11.0", default-features = false, features = ["component", "assets", "inspector"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.11.0", default-features = false, features = ["component", "assets", "inspector", "test-support"] }
