[package]
name = "gpui-agentation-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Standalone stdio MCP bridge for development annotations in local GPUI apps"
repository = "https://github.com/emmanuel-defreitas/gpui-agentation"
readme = "README.md"
keywords = ["mcp", "gpui", "annotations", "devtools"]
categories = ["development-tools", "command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "server.json"]

# Independent workspace: publishing/testing this binary never resolves GPUI/Ely.
[workspace]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde_json = "1.0"
