[package]
name = "gpui-agentation"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native GPUI development annotations with an optional stdio MCP bridge"
repository = "https://github.com/emmanuel-defreitas/gpui-agentation"
homepage = "https://emmanuel-defreitas.github.io/gpui-agentation/"
keywords = ["gpui", "mcp", "devtools", "annotations", "inspector"]
categories = ["development-tools", "development-tools::debugging", "gui"]
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/server.json", "/docs/**", "!/docs/assets/*.gif", "/ORIGIN.md", "/demo/**", "/examples/**", "/skills/**", "/Makefile", "/build.rs", "/build/**", "/vendor/ely/src/**", "/vendor/ely/assets/**", "/vendor/ely/LICENSE", "/vendor/ely/README.md", "/vendor/ely/Cargo.upstream.toml", "/vendor/ely/UPSTREAM.json"]

[package.metadata.bundled-ely]
repository = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components"
revision = "da3fdcaf39f2fa85ce1dd9cad07c3c81cf1dd721"
version = "0.1.1"

[features]
default = ["mcp"]
native = [
    "dep:atomic-write-file",
    "dep:axum",
    "dep:futures-util",
    "dep:gpui",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:uuid",
    "dep:anyhow",
    "dep:base64",
    "dep:barcoders",
    "dep:emojis",
    "dep:futures",
    "dep:gpui_platform",
    "dep:image",
    "dep:iso_currency",
    "dep:isocountry",
    "dep:isolang",
    "dep:jiff",
    "dep:log",
    "dep:markdown",
    "dep:mermaid-rs-renderer",
    "dep:pulldown-cmark",
    "dep:qrcode",
    "dep:ratex-layout",
    "dep:ratex-parser",
    "dep:ratex-svg",
    "dep:ratex-types",
    "dep:regex",
    "dep:rqrr",
    "dep:rust-embed",
    "dep:similar",
    "dep:smallvec",
    "dep:unicode-segmentation",
    "dep:unicode-width",
    "dep:usvg",
    "dep:vte",
    "dep:web-time",
    "dep:alacritty_terminal",
    "dep:block",
    "dep:cocoa",
    "dep:objc",
    "dep:raw-window-handle",
    "dep:rustix",
    "dep:wry",
    "dep:proc-macro2",
    "gpui_platform/runtime_shaders",
    "serde_json/preserve_order",
]
mcp = ["dep:reqwest", "dep:serde_json"]
test-support = ["native", "gpui/test-support"]

[[bin]]
name = "gpui-agentation"
path = "src/bin/gpui-agentation.rs"
required-features = ["mcp"]

[lints.clippy]
collapsible_if = "allow"
derivable_impls = "allow"
enum_variant_names = "allow"
explicit_auto_deref = "allow"
if_same_then_else = "allow"
let_and_return = "allow"
let_unit_value = "allow"
map_flatten = "allow"
map_unwrap_or = "allow"
needless_borrow = "allow"
new_ret_no_self = "allow"
new_without_default = "allow"
redundant_closure_call = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
unnecessary_sort_by = "allow"
unneeded_wildcard_pattern = "allow"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"], optional = true }
atomic-write-file = { version = "0.3.0", optional = true }
axum = { version = "0.7.9", optional = true }
futures-util = { version = "0.3", optional = true }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2.0.18", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"], optional = true }
uuid = { version = "1.23.1", features = ["serde", "v4"], optional = true }

anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
barcoders = { version = "2", default-features = false, features = ["std"], optional = true }
emojis = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
iso_currency = { version = "0.7", features = ["iterator"], optional = true }
isocountry = { version = "0.3", optional = true }
isolang = { version = "2.4", features = ["local_names", "list_languages"], optional = true }
jiff = { version = "0.2", optional = true }
log = { version = "0.4", optional = true }
markdown = { version = "=1.0.0", optional = true }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false, optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
ratex-layout = { version = "=0.1.14", optional = true }
ratex-parser = { version = "=0.1.14", optional = true }
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"], optional = true }
ratex-types = { version = "=0.1.14", optional = true }
regex = { version = "1", optional = true }
rqrr = { version = "0.11", default-features = false, optional = true }
rust-embed = { version = "8.12", optional = true }
similar = { version = "3.2", default-features = false, features = ["std", "text", "inline", "unicode"], optional = true }
smallvec = { version = "1", optional = true }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }
usvg = { version = "0.46", optional = true }
vte = { version = "0.15", default-features = false, features = ["std", "ansi"], optional = true }
web-time = { version = "1.1", optional = true }

[build-dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
alacritty_terminal = { version = "0.26", default-features = false, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
jiff = { version = "0.2", features = ["js"], optional = true }
rust-embed = { version = "8.12", features = ["debug-embed"], optional = true }
similar = { version = "3.2", default-features = false, features = ["wasm32_web_time"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block = { version = "0.1", optional = true }
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wry = { version = "0.57", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"], optional = true }

[dev-dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "multipart", "rustls", "stream"] }
tempfile = { version = "3.27.0" }

[[example]]
name = "demo"
path = "demo/main.rs"
required-features = ["native"]

[workspace]
members = ["examples/consumer"]
default-members = ["."]
resolver = "2"
