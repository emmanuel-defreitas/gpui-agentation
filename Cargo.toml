[package]
name = "gpui-agentation"
version = "0.6.0"
edition = "2024"
# Keep the inspector patch in Git/path consumers until a fixed Kit family is published.
publish = false
rust-version = "1.95"
license = "MIT"
description = "Native GPUI development annotations with an optional stdio MCP bridge"
repository = "https://github.com/emmanuel-defreitas/gpui-agentation"
homepage = "https://emmanuel-defreitas.github.io/gpui-agentation/"
keywords = ["gpui", "mcp", "devtools", "annotations", "inspector"]
categories = ["development-tools", "development-tools::debugging", "gui"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/server.json", "/site/docs/**", "!/site/docs/assets/*.gif", "/ORIGIN.md", "/example/**", "/skills/**", "/Makefile"]

[features]
default = ["mcp"]
native = ["dep:anyhow", "dep:atomic-write-file", "dep:axum", "dep:block", "dep:cocoa", "dep:futures", "dep:futures-util", "dep:gpui", "dep:log", "dep:objc", "dep:raw-window-handle", "dep:serde", "dep:serde_json", "dep:shlex", "dep:thiserror", "dep:tokio", "dep:uuid"]
mcp = ["dep:reqwest", "dep:serde_json"]
test-support = ["native", "gpui/test-support"]

[[bin]]
name = "gpui-agentation"
path = "src/bin/gpui-agentation.rs"
required-features = ["mcp"]

[lints.clippy]
collapsible_if = "allow"
derivable_impls = "allow"
enum_variant_names = "allow"
explicit_auto_deref = "allow"
if_same_then_else = "allow"
let_and_return = "allow"
let_unit_value = "allow"
map_flatten = "allow"
map_unwrap_or = "allow"
needless_borrow = "allow"
new_ret_no_self = "allow"
new_without_default = "allow"
redundant_closure_call = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
unnecessary_sort_by = "allow"
unneeded_wildcard_pattern = "allow"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"], optional = true }
atomic-write-file = { version = "0.3.0", optional = true }
axum = { version = "0.8.9", optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2.0.18", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"], optional = true }
uuid = { version = "1.23.1", features = ["serde", "v4"], optional = true }
anyhow = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
shlex = { version = "2", optional = true }
block = { version = "0.1", optional = true }
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
raw-window-handle = { version = "0.6", features = ["std"], optional = true }
gpui = { package = "gpui-kit", version = "=0.11.0", path = "vendor/gpui-kit", default-features = false, features = ["component", "assets", "inspector"], optional = true }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "multipart", "rustls", "stream"] }
tempfile = { version = "3.27.0" }

[workspace]
exclude = ["vendor/gpui-kit", "vendor/gpui-base", "vendor/gpui-component"]
members = ["example"]
default-members = ["."]
resolver = "2"
