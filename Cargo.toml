[package]
name = "gpui_agentation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Development-only native GPUI feedback with a local agent API"
repository = "https://github.com/emmanuel-defreitas/gpui-agentation"
readme = "README.md"

[lints.clippy]
collapsible_if = "allow"
derivable_impls = "allow"
enum_variant_names = "allow"
explicit_auto_deref = "allow"
if_same_then_else = "allow"
let_and_return = "allow"
let_unit_value = "allow"
map_flatten = "allow"
map_unwrap_or = "allow"
needless_borrow = "allow"
new_ret_no_self = "allow"
new_without_default = "allow"
redundant_closure_call = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
unnecessary_sort_by = "allow"
unneeded_wildcard_pattern = "allow"

[dependencies]
atomic-write-file = { version = "0.3.0" }
axum = "0.7.9"
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "da3fdcaf39f2fa85ce1dd9cad07c3c81cf1dd721" }
futures-util = { version = "0.3" }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2.0.18" }
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
reqwest = { version = "0.12.24", default-features = false, features = ["cookies", "json", "multipart", "rustls-tls", "stream"] }
tempfile = { version = "3.27.0" }

[workspace]
exclude = ["crates/gpui-agentation-mcp"]
